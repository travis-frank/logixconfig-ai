[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logixconfig"
version = "0.1.0"
description = "Turn a plain-English process description into validated Logix tags, draft docs, and a starter L5X file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "lxml>=5",
    "openai>=3,<4",
    "langgraph==1.2.19",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
logixconfig = "logixconfig.cli:entry"
logixconfig-api = "logixconfig.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
